name: Test WebGrab Plus

on:
  workflow_dispatch:

jobs:
  test-webgrab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install .NET 9 runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Check dotnet version
        run: |
          dotnet --info

      - name: Download WebGrab+Plus
        run: |
          wget -O webgrab.tar.gz "http://webgrabplus.com/sites/default/files/download/SW/V5.3.0/WebGrabPlus_V5.3_install.tar.gz"
          mkdir webgrab
          tar -xzf webgrab.tar.gz -C webgrab

      - name: List WebGrab files
        run: |
          ls -la webgrab
