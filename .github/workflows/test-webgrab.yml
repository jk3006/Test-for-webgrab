name: Test WebGrab Plus

on:
  workflow_dispatch:

jobs:
  test-webgrab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install .NET 9 runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Download WebGrab+Plus
        run: |
          cd ~
          wget -O WebGrabPlus_install.tar.gz "https://webgrabplus.com/sites/default/files/download/SW/V5.5.0/WebGrabPlus_5.5_install.tar.gz"

      - name: Extract WebGrab+Plus
        run: |
          cd ~
          tar -zxvf WebGrabPlus_install.tar.gz

      - name: Show installed files
        run: |
          ls -la ~/.wg++

      - name: Install WebGrab+Plus
        run: |
          cd ~/.wg++
          chmod +x install.sh
          ./install.sh

      - name: Copy config
        run: |
          cp $GITHUB_WORKSPACE/webgrab/WebGrab++.config.xml ~/.wg++/

      - name: Test internet from GitHub Actions
        run: |
          curl -I https://www.google.com
          curl -I https://webgrabplus.com
          ping -c 4 8.8.8.8 || true

      - name: Run WebGrab+Plus
        run: |
          cd ~/.wg++
          DOTNET_SYSTEM_NET_DISABLEIPV6=1 ./run.net.sh WebGrab++.config.xml
